<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PS5 · Live player</title><link rel="stylesheet" href="/player.css"></head>
<body>
<header class="page-heading"><div><h1>PS5 HDMI Stream</h1><p>Your console, live.</p></div><a href="/player">Open fullscreen player ↗</a></header>
<main class="wrap"><live-video-player>
<media-container class="console-player" aria-label="PS5 live player">
  <video id="v" autoplay muted playsinline aria-label="Live PS5 video"></video>
  <div class="overlay" id="ov">Connecting to console…</div>
  <div class="player-heading"><span class="brand">PS5 <span>LIVE</span></span><span class="status"><span id="dot" class="dot"></span><span id="state" role="status" aria-live="polite">Connecting…</span></span></div>
  <div class="player-controls" aria-label="Player controls">
    <media-play-button id="playback" title="Play or pause"><span class="play-icon" aria-hidden="true">▶</span><span class="pause-icon" aria-hidden="true">Ⅱ</span></media-play-button>
    <button id="mute" disabled>Unmute</button>
    <media-volume-slider label="Volume" class="volume"><media-slider-track><media-slider-fill></media-slider-fill></media-slider-track><media-slider-thumb></media-slider-thumb></media-volume-slider>
    <span class="control-spacer"></span>
    <details id="quality-menu" class="quality-menu">
      <summary title="Player settings">Settings</summary>
      <form id="settings-form" class="settings-popover">
        <label for="resolution">Capture resolution</label>
        <select id="resolution" name="resolution">
          <option value="4k">4K · 60 fps</option><option value="1440p">1440p · 60 fps</option><option value="1080p" selected>1080p · 60 fps</option><option value="720p">720p · 60 fps</option>
        </select>
        <button id="apply" type="submit">Apply resolution</button>
        <p id="settings-message" role="status" aria-live="polite">Checking capture settings…</p>
        <p class="hint">Changes apply to all viewers.</p>
        <button id="play" type="button" title="Stop streaming">Stop</button>
      </form>
    </details>
    <button id="reload" title="Reconnect to live stream">↻<span class="sr-only"> Reconnect</span></button>
    <media-pip-button title="Picture in picture"><span aria-hidden="true">▣</span></media-pip-button>
    <media-fullscreen-button title="Fullscreen"><span aria-hidden="true">⛶</span></media-fullscreen-button>
  </div>
</media-container>
</live-video-player>
<section class="stream-info" aria-label="Stream information"><span>Video <strong id="res">—</strong></span><span>Frame rate <strong id="fps">—</strong></span><span>Audio <strong id="aud">—</strong></span><span>Viewers <strong id="cli">—</strong></span></section>
<details class="log-panel"><summary>Payload log</summary><pre id="log">…</pre></details>
</main><footer>Served from your console · <a href="/status">Stream status</a></footer>
<script src="/vendor/videojs.min.js"></script>
<script src="/vendor/flv.min.js"></script>
<script src="/app.js"></script>
</body></html>
